name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.13

      - name: Install
        run: bun install --frozen-lockfile

      # BUILD_INFO.json is read by apps/web/vite.config.ts and the version tests.
      - name: Build marker
        run: bun run build:info

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: ignore

      - name: Build
        run: bun run build

  # Screen-generation quality gate: re-scores the eval baselines touched by the
  # pull request (prompts, skills, craft knowledge, scorecards).
  eval-release-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.13

      - name: Install
        run: bun install --frozen-lockfile

      - name: Collect changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --name-only "$BASE_SHA" "$HEAD_SHA" > changed-files.txt

      - name: PR eval gate
        run: bun run eval:pr-gate --changed-files changed-files.txt --output eval-gate-out

      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-eval-release-gate-${{ github.event.pull_request.number }}
          path: eval-gate-out
          if-no-files-found: ignore
